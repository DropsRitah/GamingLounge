<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Elite Gaming | Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="height: 100vh;">
        <div class="glass-card" style="width: 400px;">
            <h2 class="text-center mb-4 text-info">ELITE GAMING</h2>
            
            <!-- Flash messages for errors -->
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label text-white">Access Level</label>
                    <select name="role" class="form-select bg-dark text-white border-info">
                        <option value="staff">Staff / User Side</option>
                        <option value="admin">Administrator Side</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Username</label>
                    <input type="text" name="username" class="form-control bg-dark text-white border-info" placeholder="Enter username" required>
                </div>
                <div class="mb-3">
                    <label class="form-label text-white">Password</label>
                    <input type="password" name="password" class="form-control bg-dark text-white border-info" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-neon w-100 mt-3">ENTER SYSTEM</button>
            </form>
        </div>
    </div>
</body>
</html>
